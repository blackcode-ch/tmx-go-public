name: public CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-command-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TMX_PUBLIC_SNAPSHOT: '1'
      GOTOOLCHAIN: go1.26.6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: jmquero92/tmx-go-public
          ref: f9f0d11a29eff0a65ae3deb5bf5af7370eee9838
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 12.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Verify exact source and record tool versions
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = f9f0d11a29eff0a65ae3deb5bf5af7370eee9838
          git rev-parse HEAD
          git status --porcelain
          go version
          node --version
          pnpm --version
          make --version
          echo "TMXG_HOME=$(mktemp -d)" >> "$GITHUB_ENV"
      - name: Documented headless build
        run: make headless
      - name: Documented focused API tests
        run: go test -count=1 ./internal/api
      - name: Documented UI unit tests
        run: (cd ui && pnpm test test/*.test.mjs)
