name: public CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timing-proof:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      TMX_PUBLIC_SNAPSHOT: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Record exact source
        run: git rev-parse HEAD
      - name: Repeat both timing tests 20 times
        run: go test -v -tags tmx_ci -run '^(TestApprovalActionLifecycle|TestGovernedChatRevocationBeforePlacement)$' -count=20 -timeout=10m ./internal/fleet ./internal/chat
      - name: Race check both tests
        if: runner.os == 'Linux'
        run: go test -race -tags tmx_ci -run '^(TestApprovalActionLifecycle|TestGovernedChatRevocationBeforePlacement)$' -count=1 -timeout=10m ./internal/fleet ./internal/chat
