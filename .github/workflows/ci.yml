# Public CI for the scrubbed tmx-go snapshot. Runs on GitHub's free hosted runners only (never
# self-hosted). Triggers: the mirror bot's pushes (main and fleet-pr/<N> snapshot branches) and
# outside PRs, which get no secrets (there are none here) and need maintainer approval to run.
name: public CI
on:
  push:
    branches: [main, "fleet-pr/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  TMX_PUBLIC_SNAPSHOT: "1"   # tests of private-only files (the release workflow) skip
concurrency:
  group: public-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  go-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -timeout=15m ./...
  go-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go build ./...
      - run: go test -count=1 -timeout=15m ./...
      - run: go test -tags=aclmutate -count=1 -timeout=10m ./internal/config/...
  race:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go test -race -count=1 -timeout=20m ./...
  ui-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: make deps
      - run: cd ui && pnpm exec eslint . && pnpm exec tsc -b && pnpm test && pnpm build
      - run: CGO_ENABLED=0 go build -tags gatesim -trimpath -o bin/tmx-gatesim .
      - run: cd ui && pnpm exec playwright install --with-deps chromium
      - name: Trust a throwaway certificate for the phone HTTPS tests
        shell: bash
        run: |
          set -euo pipefail
          d="$RUNNER_TEMP/e2e-tls"; mkdir -p "$d"; cd "$d"
          openssl req -x509 -newkey rsa:2048 -nodes -days 2 -subj "/CN=tmx e2e CA" -keyout ca.key -out ca.pem \
            -addext "basicConstraints=critical,CA:TRUE" -addext "keyUsage=critical,keyCertSign"
          openssl req -newkey rsa:2048 -nodes -subj "/CN=tmx.localhost" -keyout key.pem -out leaf.csr
          printf "subjectAltName=DNS:tmx.localhost\nextendedKeyUsage=serverAuth\n" > leaf.ext
          openssl x509 -req -in leaf.csr -CA ca.pem -CAkey ca.key -CAcreateserial -days 2 -out cert.pem -extfile leaf.ext
          sudo apt-get install -y -qq libnss3-tools >/dev/null
          mkdir -p "$HOME/.pki/nssdb"
          if [ ! -f "$HOME/.pki/nssdb/cert9.db" ]; then
            certutil -d "sql:$HOME/.pki/nssdb" -N --empty-password
          fi
          certutil -d "sql:$HOME/.pki/nssdb" -A -t "C,," -n "tmx e2e CA" -i ca.pem
          echo "TMXG_E2E_TLS_DIR=$d" >> "$GITHUB_ENV"
      - run: cd ui && node --test --test-concurrency=1 e2e/*.e2e.mjs
  # macOS is a first-class target: most users are on Macs. It is free here, so it runs
  # on every snapshot, like Linux and Windows. The app is built UNSIGNED (ad hoc, SIGN_IDENTITY "-"):
  # the signing certificate stays private and is used only by the private release build.
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 -timeout=15m ./...
      - name: Install the Wails CLI
        run: |
          GOBIN="$RUNNER_TEMP/bin" go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.0 # keep in step with WAILS_VERSION in the Makefile
          echo "WAILS=$RUNNER_TEMP/bin/wails" >> "$GITHUB_ENV"
      - run: make deps
      - name: make app (unsigned)
        run: make app WAILS="$WAILS" SIGN_IDENTITY=-
      - run: codesign --verify --deep --strict build/bin/tmxg.app

  p2p-interop:
    name: P2P interop (pinned fleet baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout immutable public fleet baseline
        uses: actions/checkout@v4
        with:
          repository: blackcode-ch/tmx-go-public
          ref: 0a6f2cb4bb3020d7a69460f96cac0da9bdabb00c
          path: theirs
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Select the public baseline in the test harness
        # Queue snapshots may predate this workflow. Change only the test's exact
        # expected checkout SHA; keep its checkout verification and test logic.
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("internal/p2p/interop_test.go")
          text = p.read_text()
          old = 'const pinnedCommit = "0c36197f03a09ef1fa3899c42de0a8e8d8541831"'
          new = 'const pinnedCommit = "0a6f2cb4bb3020d7a69460f96cac0da9bdabb00c"'
          if text.count(old) != 1:
              raise SystemExit("Unrecognized interop test pin; review the public baseline")
          p.write_text(text.replace(old, new))
          PY
      - name: Pairing, messages and files in both directions
        env:
          TMX_P2P_INTEROP: "1"
          TMX_P2P_PINNED_CHECKOUT: ${{ github.workspace }}/theirs
        run: go test -count=1 -timeout=5m -v -run 'TestInteropOursToPinned|TestInteropPinnedToOurs' ./internal/p2p/
      - name: Current inviter admits delayed baseline joiners
        env:
          TMX_P2P_INTEROP: "1"
          TMX_P2P_PINNED_CHECKOUT: ${{ github.workspace }}/theirs
        # The baseline predates full-lifetime invite admission. Its own five-minute
        # inviter case is deliberately excluded; current inviter cases must pass.
        run: go test -count=1 -timeout=10m -v -run 'TestInteropLateJoinAdmissionWindow/^our_invite' ./internal/p2p/
      - name: Record baseline scope
        if: always()
        run: |
          echo 'Peer baseline: public 0a6f2cb, source e033901, P2P equivalent to fleet fdff3fa4.' >> "$GITHUB_STEP_SUMMARY"
          echo 'This checks fleet regression compatibility, not current upstream compatibility.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Both-direction pairing/message/file; current-side 30-second and five-minute delayed invite admission.' >> "$GITHUB_STEP_SUMMARY"
