name: public CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-host-proof:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: veriton-dev/tmx-go-public
          ref: 641412395705243c90cdbb9627edb6bcd355bba8
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify contributor head
        shell: pwsh
        run: |
          $actual = git rev-parse HEAD
          if ($actual -ne '641412395705243c90cdbb9627edb6bcd355bba8') { throw "Unexpected head $actual" }
          Write-Output "Testing exact PR4 head $actual"
      - name: Repeat recorded-host stop test 20 times
        run: go test -tags tmx_ci -run '^TestStopEndsTheRecordedHost$' -count=20 -timeout=5m ./internal/runner/host
      - name: Test full host package with CI tag
        run: go test -tags tmx_ci -count=1 -timeout=5m ./internal/runner/host
