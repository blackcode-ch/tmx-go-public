<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Approve one owner device</title>
<h1>Approve one owner device</h1>
<p>This private link permits one device pairing within ten minutes of issue.</p>
<p>On your phone, open this same HTTPS address and choose Pair this device. Keep that page open.</p>
<p id="scope">Enter only the code visible on your own device.</p>
<label>Pairing code <input id="code" maxlength="8" autocomplete="off" spellcheck="false"></label>
<button id="approve" disabled>Approve this device</button>
<p id="status" role="status">Opening private link…</p>
<script>
"use strict";
let token = new URLSearchParams(location.hash.slice(1)).get("bootstrap");
history.replaceState(null, "", location.pathname);
const status = document.getElementById("status"), button = document.getElementById("approve");
async function post(path, body) {
  const response = await fetch(path, {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || "Request failed");
  return data;
}
if (token) {
  post("/api/pair/bootstrap/exchange", {token}).then(data => {
    document.getElementById("scope").textContent = data.recovery ? "Restricted recovery only: no owner actions until a fresh host proof. The session expires at the link's original deadline." : "Owner actions on the device then use your owner PIN.";
    button.textContent = data.recovery ? "Approve restricted recovery device" : "Approve this device";
    button.disabled = false; status.textContent = "Ready to approve one device on " + location.host;
  }).catch(error => { status.textContent = error.message; });
  token = null;
} else { status.textContent = "Open a fresh private link from your authenticated recovery channel."; }
button.onclick = async () => {
  button.disabled = true;
  try {
    await post("/api/pair/bootstrap/approve", {code: document.getElementById("code").value});
    status.textContent = "Approved. Continue on your phone. This link is spent.";
  } catch (error) { status.textContent = error.message; button.disabled = false; }
};
</script></html>
