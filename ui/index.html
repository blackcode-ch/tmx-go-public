<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <!-- The browser bar takes the page background of each mode (src/lib/install-colors.ts). -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f1f5ed" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#151e19" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tiamatrix" />
    <title>tmx</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Set the theme before first paint so there is no flash.
      (function () {
        var t = null;
        try { t = localStorage.getItem("tmx.theme"); } catch (e) {}
        var dark = t === "dark" || (t !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var el = document.documentElement;
        if (dark) el.classList.add("dark");
        el.style.colorScheme = dark ? "dark" : "light";
        var bg = dark ? "#151e19" : "#f1f5ed"; // the page background, so nothing flashes
        el.style.backgroundColor = bg;
        // a theme chosen in the app wins over the system's: the browser bar follows it
        if (t === "light" || t === "dark") {
          var metas = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < metas.length; i++) metas[i].setAttribute("content", bg);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
